<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Espetinho do Pedrão</title>
    <link rel="stylesheet" href="site.css">
</head>
<body>
    <header class="topbar">
        <div class="container nav">
            <a class="brand" href="index.html">
                <img src="deli.png" alt="Logo da churrascaria">
                <span>Espetinho do Pedrão</span>
            </a>
            <nav class="menu" aria-label="Navegação principal">
                <a href="index.html">Quem somos</a>
                <a href="cadastro.html">Cadastro</a>
                <a href="pedido.html">Pedido</a>
                <a href="pesquisa.html">Pesquisa</a>
                <a class="active" href="contato.html">Contato</a>
            </nav>
        </div>
    </header>

    <main class="page-shell">
        <div class="container contact-layout">
            <aside class="contact-cards">
                <div class="contact-card">
                    <h3>Endereço</h3>
                    <p>Rua Leonar, nº 01<br>Centro de Palmas</p>
                </div>

                <div class="contact-card">
                    <h3>Contato</h3>
                    <ul>
                        <li>(31) 4002-8922</li>
                        <li>contato@espetinhodopedrao.com</li>
                        <li>Segunda a Domingo • 11h às 23h</li>
                    </ul>
                </div>
            </aside>

            <section class="panel">
                <h1>Fale conosco</h1>
                <form class="form-grid">
                    <label class="field">
                        <span>Seu nome</span>
                        <input type="text" placeholder="Digite seu nome" />
                    </label>

                    <label class="field">
                        <span>Email</span>
                        <input type="email" placeholder="seu@email.com" />
                    </label>

                    <label class="field">
                        <span>Mensagem</span>
                        <textarea placeholder="Escreva sua mensagem aqui..."></textarea>
                    </label>

                    <div class="form-actions">
                        <button type="submit" class="btn primary">Enviar mensagem</button>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <footer class="footer">
        Churrascaria Espetinho do Pedrão • Sabor que marca o momento.
    </footer>
</body>
</html>
