<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Espetinho do Pedrão</title>
    <link rel="stylesheet" href="site.css">
</head>
<body>
    <header class="topbar">
        <div class="container nav">
            <a class="brand" href="index.html">
                <img src="deli.png" alt="Logo da churrascaria">
                <span>Espetinho do Pedrão</span>
            </a>
            <nav class="menu" aria-label="Navegação principal">
                <a href="index.html">Quem somos</a>
                <a class="active" href="cadastro.html">Cadastro</a>
                <a href="pedido.html">Pedido</a>
                <a href="pesquisa.html">Pesquisa</a>
                <a href="contato.html">Contato</a>
            </nav>
        </div>
    </header>

    <main class="page-shell">
        <div class="container narrow">
            <section class="panel">
                <h1>Cadastro</h1>
                <form class="form-grid">
                    <label class="field">
                        <span>Nome completo</span>
                        <input type="text" placeholder="Digite seu nome" />
                    </label>

                    <label class="field">
                        <span>Endereço</span>
                        <input type="text" placeholder="Rua, número, bairro" />
                    </label>

                    <label class="field">
                        <span>CPF</span>
                        <input type="text" placeholder="000.000.000-00" />
                    </label>

                    <label class="field">
                        <span>Telefone</span>
                        <input type="tel" placeholder="(00) 00000-0000" />
                    </label>

                    <div class="form-actions">
                        <button type="submit" class="btn primary">Salvar cadastro</button>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <footer class="footer">
        Churrascaria Espetinho do Pedrão • Sabor que marca o momento.
    </footer>
</body>
</html>
